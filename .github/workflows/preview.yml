name: Deploy pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, labeled, unlabeled]

# Per-PR groups so queued previews are not cancelled when many PRs update at
# once (a shared pages-publish group drops previously pending runs). Label
# accept stays on its own group. cancel-in-progress only replaces stale runs
# for the same PR. Parallel gh-pages pushes get a second deploy attempt below.
concurrency:
  group: ${{ contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && format('visual-label-pr-{0}', github.event.number) || format('preview-pr-{0}', github.event.number) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint and type-check
        run: pnpm lint
      - name: Run tests
        run: pnpm test
      - name: Check out PR base for visual baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: visual-base
          persist-credentials: false
      - name: Detect visual baseline
        id: visual_base
        run: |
          if [ -f visual-base/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "PR base has no site package.json; capturing PR screenshots without a local baseline."
          fi
      - name: Install baseline dependencies
        if: steps.visual_base.outputs.present == 'true'
        working-directory: visual-base
        run: pnpm install --frozen-lockfile
      - name: Build visual baseline
        if: steps.visual_base.outputs.present == 'true'
        working-directory: visual-base
        run: pnpm build
      - name: Build PR site for visual compare
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm playwright:install
      - name: Accessibility checks
        run: pnpm test:a11y
      - name: SEO metadata checks
        run: pnpm test:seo
      - name: Lead form Playwright checks
        run: pnpm test:lead-forms
      - name: Capture visual screenshots
        run: pnpm test:visual
        env:
          VISUAL_BASE_PATH: /
          VISUAL_BASE_DIR: ${{ steps.visual_base.outputs.present == 'true' && format('{0}/visual-base/dist', github.workspace) || '' }}
          VISUAL_SKIP_BASE: ${{ steps.visual_base.outputs.present == 'true' && '0' || '1' }}
          VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VISUAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Build preview site
        run: pnpm build
        env:
          PREVIEW_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
      - name: Host visual report under preview
        run: |
          rm -rf dist/visual
          cp -R test-results/visual dist/visual
      - name: Upload visual screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-pr-${{ github.event.number }}
          path: test-results/visual
          if-no-files-found: error
          retention-days: 14
      - name: Upload preview dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    needs: preview
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download preview dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-dist
          path: dist
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: platform-kit-marketing
          permission-contents: write
      # pr-preview-action is composite; wretry cannot wrap it. Retry push races
      # against production / other previews with a second attempt.
      - name: Deploy preview
        id: preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false
      - name: Retry deploy preview
        if: steps.preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false

  comment:
    needs: [preview, deploy-preview]
    if: >
      always() &&
      !cancelled() &&
      needs.preview.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download visual screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: visual-pr-${{ github.event.number }}
          path: test-results/visual
      - name: Build sticky preview comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: https://plattform-kit.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/
          VISUAL_URL: https://plattform-kit.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/visual/
        with:
          script: |
            const fs = require("node:fs");
            const manifest = JSON.parse(
              fs.readFileSync("test-results/visual/manifest.json", "utf8"),
            );
            const summary = manifest.summary ?? {
              changed: 0,
              new: 0,
              unchanged: 0,
              changedRoutes: [],
              newRoutes: [],
              hasDiffs: false,
            };
            const changedList =
              summary.changedRoutes?.length > 0
                ? summary.changedRoutes.map((r) => `\`${r}\``).join(", ")
                : "—";
            const newList =
              summary.newRoutes?.length > 0
                ? summary.newRoutes.map((r) => `\`${r}\``).join(", ")
                : "—";
            const statusLine = !summary.hasDiffs
              ? "✅ Visual review clear vs PR base (no new or changed pages)."
              : summary.changed > 0 && summary.new > 0
                ? `⚠️ Visual review needed: ${summary.changed} changed route(s), ${summary.new} new. Open the report, then add \`visual-accepted\` (no rebuild).`
                : summary.new > 0
                  ? `⚠️ Visual review needed: ${summary.new} new page(s) vs base. Open the report, then add \`visual-accepted\` (no rebuild).`
                  : `⚠️ Visual review needed: ${summary.changed} changed route(s) vs base. Open the report, then add \`visual-accepted\` (no rebuild).`;
            const body = [
              "## Preview",
              "",
              `🔗 **[Open live preview](${process.env.PREVIEW_URL})**`,
              "",
              `🖼️ **[Open visual report](${process.env.VISUAL_URL})** (base vs PR vs diff)`,
              "",
              statusLine,
              "",
              `- Changed routes: ${changedList}`,
              `- New routes: ${newList}`,
              `- Unchanged viewports: ${summary.unchanged ?? 0}`,
              `- Required check: **visual-review** (cleared by \`visual-accepted\` after you review)`,
              `- Artifact backup: \`visual-pr-${context.issue.number}\``,
              "",
            ].join("\n");
            fs.writeFileSync("preview-comment.md", body);
      - name: Post sticky preview comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: platform-kit-preview
          recreate: true
          path: preview-comment.md
      - name: Update preview link in pull request body
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: https://plattform-kit.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/
          VISUAL_URL: https://plattform-kit.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/visual/
        with:
          script: |
            const markerStart = "<!-- platform-kit-preview:start -->";
            const markerEnd = "<!-- platform-kit-preview:end -->";
            const managedBlock = new RegExp(
              `${markerStart}[\\s\\S]*?${markerEnd}\\n*`,
              "m",
            );
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const currentBody = pull.data.body ?? "";
            const bodyWithoutPreview = currentBody.replace(managedBlock, "").trim();
            const previewBlock = [
              markerStart,
              "## Preview",
              "",
              `🔗 **[Open live preview](${process.env.PREVIEW_URL})**`,
              "",
              `🖼️ **[Open visual report](${process.env.VISUAL_URL})**`,
              markerEnd,
            ].join("\n");
            const body = `${previewBlock}${bodyWithoutPreview ? `\n\n${bodyWithoutPreview}` : ""}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body,
            });

  visual-review:
    name: visual-review
    needs: [preview]
    if: >
      always() &&
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed' &&
      (
        needs.preview.result == 'success' ||
        (
          needs.preview.result == 'skipped' &&
          contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
          github.event.label.name == 'visual-accepted'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect visual-accepted label
        id: accept
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const accepted = labels.some((l) => l.name === "visual-accepted");
            core.setOutput("accepted", accepted ? "true" : "false");
            if (accepted) {
              core.info("Label visual-accepted is present; gate will pass if the artifact matches this head.");
            }
      - name: Download visual artifact from this run
        if: needs.preview.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: visual-pr-${{ github.event.number }}
          path: test-results/visual
      - name: Download latest visual artifact for this PR
        if: needs.preview.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.number }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARTIFACT="visual-pr-${PR_NUMBER}"
          ID=""
          for _ in $(seq 1 12); do
            mapfile -t CANDIDATES < <(
              gh api --paginate --slurp \
                "repos/${GH_REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=100" \
                | jq -r --arg sha "$HEAD_SHA" '
                  [.[] | .artifacts[]]
                  | map(select(.expired == false and .workflow_run.head_sha == $sha))
                  | .[].id
                '
            )
            for candidate in "${CANDIDATES[@]:-}"; do
              [ -n "$candidate" ] || continue
              rm -rf /tmp/visual-candidate test-results/visual
              mkdir -p /tmp/visual-candidate
              gh api "repos/${GH_REPOSITORY}/actions/artifacts/${candidate}/zip" \
                > /tmp/visual-candidate.zip
              unzip -qo /tmp/visual-candidate.zip -d /tmp/visual-candidate
              ARTIFACT_HEAD_SHA="$(
                jq -r '.headSha // empty' /tmp/visual-candidate/manifest.json
              )"
              ARTIFACT_BASE_SHA="$(
                jq -r '.baseSha // empty' /tmp/visual-candidate/manifest.json
              )"
              if [ -z "$ARTIFACT_HEAD_SHA" ]; then
                echo "Skipping artifact ${candidate}: missing manifest.headSha"
                continue
              fi
              if [ "$ARTIFACT_HEAD_SHA" != "$HEAD_SHA" ]; then
                echo "Skipping artifact ${candidate}: headSha ${ARTIFACT_HEAD_SHA} != ${HEAD_SHA}"
                continue
              fi
              if [ -n "$ARTIFACT_BASE_SHA" ] && [ "$ARTIFACT_BASE_SHA" != "$BASE_SHA" ]; then
                echo "Skipping artifact ${candidate}: baseSha ${ARTIFACT_BASE_SHA} != ${BASE_SHA}"
                continue
              fi
              mkdir -p test-results/visual
              cp -R /tmp/visual-candidate/. test-results/visual/
              ID="$candidate"
              break
            done
            if [ -n "$ID" ]; then
              break
            fi
            echo "No ${ARTIFACT} artifact for head ${HEAD_SHA} + base ${BASE_SHA} yet; waiting..."
            sleep 20
          done
          if [ -z "$ID" ]; then
            echo "No ${ARTIFACT} artifact for head ${HEAD_SHA} with base ${BASE_SHA}."
            exit 1
          fi
          echo "Using artifact ${ID} for head ${HEAD_SHA} base ${BASE_SHA}"
          python3 - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path("test-results/visual/manifest.json").read_text())
          summary = manifest.get("summary") or {}
          print(
              f"Artifact summary: changed={summary.get('changed')} new={summary.get('new')} "
              f"hasDiffs={summary.get('hasDiffs')} headSha={manifest.get('headSha')} "
              f"baseSha={manifest.get('baseSha')} baseLabel={manifest.get('baseLabel')}"
          )
          PY
      - name: Confirm visual artifact matches current head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ARTIFACT_HEAD_SHA="$(jq -r '.headSha // empty' test-results/visual/manifest.json)"
          if [ -z "$ARTIFACT_HEAD_SHA" ]; then
            echo "::error::Visual artifact is missing headSha; cannot confirm it matches ${HEAD_SHA}."
            exit 1
          fi
          if [ "$ARTIFACT_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Visual artifact headSha ${ARTIFACT_HEAD_SHA} does not match current head ${HEAD_SHA}."
            exit 1
          fi
          echo "Visual artifact headSha matches current head ${HEAD_SHA}."
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run visual gate
        env:
          VISUAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VISUAL_ACCEPTED: ${{ steps.accept.outputs.accepted == 'true' && '1' || '0' }}
        run: node tests/visual-gate.mjs

  cleanup-preview:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: platform-kit-marketing
          permission-contents: write
      - name: Remove preview
        id: remove_preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false
      - name: Retry remove preview
        if: steps.remove_preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: https://plattform-kit.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false

  cleanup-comment:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Hide sticky preview comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: platform-kit-preview
          hide: true
      - name: Remove preview block from pull request body
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const markerStart = "<!-- platform-kit-preview:start -->";
            const markerEnd = "<!-- platform-kit-preview:end -->";
            const managedBlock = new RegExp(
              `${markerStart}[\\s\\S]*?${markerEnd}\\n*`,
              "m",
            );
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const currentBody = pull.data.body ?? "";
            const body = currentBody.replace(managedBlock, "").trim();
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body,
            });
